<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#fcd34d">
<title>Tu pedido</title>
<style>
  /* =========================================================
     Página del proveedor (la que abre el QR)
     Un solo archivo, sin librerías: carga rápido en cualquier celular.
     ========================================================= */
  :root {
    --amarillo: #fcd34d;      /* amber-300 */
    --amarillo-claro: #fef3c7; /* amber-100 */
    --amarillo-btn: #fbbf24;  /* amber-400 */
    --cafe: #451a03;          /* amber-950 */
    --fondo: #fafaf9;         /* stone-50 */
    --borde: #e7e5e4;         /* stone-200 */
    --texto: #292524;         /* stone-800 */
    --tenue: #78716c;         /* stone-500 */
    --verde: #059669;
    --rojo: #b91c1c;
    --naranja: #c2410c;
    --radio: 14px;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 16px;
    line-height: 1.45;
    color: var(--texto);
    background: var(--fondo);
  }
  header {
    background: var(--amarillo);
    color: var(--cafe);
    padding: calc(14px + env(safe-area-inset-top, 0px)) 18px 14px;
    font-weight: 700;
    font-size: 17px;
    box-shadow: 0 1px 2px rgba(0,0,0,.08);
  }
  main { max-width: 560px; margin: 0 auto; padding: 16px 14px 170px; }
  .tarjeta {
    background: #fff;
    border: 1px solid var(--borde);
    border-radius: var(--radio);
    padding: 16px;
    margin-bottom: 14px;
    box-shadow: 0 1px 2px rgba(0,0,0,.04);
  }
  h1, h2 { margin: 0; }
  .etiqueta { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--tenue); margin: 0 0 10px; }
  .modelo { font-size: 26px; font-weight: 800; letter-spacing: .02em; color: #1c1917; word-break: break-word; }
  .datos { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 6px; color: var(--tenue); font-size: 14px; }
  .datos b { color: var(--texto); font-weight: 600; }
  .chip-proceso { display: inline-block; margin-top: 10px; background: var(--amarillo-claro); color: var(--cafe); border-radius: 999px; padding: 4px 12px; font-size: 14px; font-weight: 600; }

  /* ---- Tabla de tallas ---- */
  table { width: 100%; border-collapse: collapse; }
  th { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--tenue); padding: 0 4px 8px; text-align: center; }
  th:first-child, td:first-child { text-align: left; }
  td { padding: 6px 4px; border-top: 1px solid #f5f5f4; text-align: center; font-variant-numeric: tabular-nums; }
  td.talla { font-weight: 700; font-size: 17px; }
  td.pedidas { color: var(--tenue); }
  td.faltan { font-weight: 600; color: var(--tenue); min-width: 44px; }
  td.faltan.hay { color: var(--naranja); }
  td.faltan.mal { color: var(--rojo); }
  input[type=number] {
    width: 100%;
    max-width: 78px;
    font: inherit;
    font-size: 18px;
    font-weight: 600;
    text-align: center;
    padding: 10px 4px;
    border: 1.5px solid #d6d3d1;
    border-radius: 10px;
    background: #fff;
    color: var(--texto);
    -moz-appearance: textfield;
  }
  input[type=number]::-webkit-outer-spin-button, input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  input[type=number]:focus, textarea:focus { outline: none; border-color: var(--amarillo-btn); box-shadow: 0 0 0 3px var(--amarillo-claro); }
  input.mal { border-color: var(--rojo); background: #fef2f2; }
  .punto { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; vertical-align: 1px; }
  .totales { display: flex; justify-content: space-between; gap: 8px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--borde); font-size: 14px; color: var(--tenue); flex-wrap: wrap; }
  .totales b { color: var(--texto); }

  /* ---- Botones ---- */
  button { font: inherit; cursor: pointer; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    border: 0; border-radius: 12px; padding: 14px 18px; font-weight: 700; font-size: 16px;
    transition: transform .06s, background-color .15s;
  }
  .btn:active { transform: scale(.98); }
  .btn-primario { background: var(--amarillo-btn); color: var(--cafe); width: 100%; box-shadow: 0 1px 2px rgba(0,0,0,.1); }
  .btn-primario:hover { background: var(--amarillo); }
  .btn-primario[disabled] { opacity: .6; cursor: wait; }
  .btn-secundario { background: #fff; border: 1.5px solid #d6d3d1; color: var(--texto); }
  .btn-chico { padding: 8px 12px; font-size: 14px; border-radius: 10px; }
  :focus-visible { outline: 3px solid #f59e0b; outline-offset: 2px; }

  textarea {
    width: 100%; min-height: 84px; resize: vertical;
    font: inherit; padding: 12px; border: 1.5px solid #d6d3d1; border-radius: 12px; background: #fff; color: var(--texto);
  }

  /* ---- Elegir día y hora (radios con forma de botón) ---- */
  .opciones { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 8px; margin: 0 -2px; scrollbar-width: thin; }
  .rejilla { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; }
  .rejilla .opcion span { padding: 10px 4px; }
  .opcion { position: relative; flex-shrink: 0; }
  .opcion input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
  .opcion span {
    display: block; text-align: center; padding: 10px 12px; border-radius: 12px;
    border: 1.5px solid #d6d3d1; background: #fff; font-weight: 600; font-size: 15px; white-space: nowrap;
  }
  .opcion small { display: block; font-weight: 500; font-size: 12px; color: var(--tenue); }
  .opcion input:checked + span { background: var(--amarillo); border-color: var(--amarillo-btn); color: var(--cafe); }
  .opcion input:checked + span small { color: var(--cafe); }
  .opcion input:focus-visible + span { outline: 3px solid #f59e0b; outline-offset: 2px; }
  .opcion input:disabled + span { opacity: .35; text-decoration: line-through; }
  .dia span { min-width: 74px; }
  fieldset { border: 0; padding: 0; margin: 0 0 14px; min-width: 0; }
  legend { font-weight: 600; margin-bottom: 8px; padding: 0; }

  .aviso { border-radius: 12px; padding: 12px 14px; font-size: 15px; margin-bottom: 14px; }
  .aviso-error { background: #fef2f2; color: var(--rojo); border: 1px solid #fecaca; }
  .aviso:empty { display: none; }

  /* ---- Pantallas de estado ---- */
  .estado { text-align: center; padding: 26px 16px; }
  .icono { width: 60px; height: 60px; border-radius: 50%; display: grid; place-items: center; margin: 0 auto 12px; font-size: 30px; }
  .icono-ok { background: #d1fae5; color: var(--verde); }
  .icono-cita { background: var(--amarillo-claro); color: var(--cafe); }
  .icono-gris { background: #f5f5f4; color: var(--tenue); }
  .estado h2 { font-size: 21px; }
  .estado p { color: var(--tenue); margin: 6px 0 0; }
  .estado .fecha-grande { font-size: 22px; font-weight: 800; color: var(--cafe); margin-top: 10px; }
  .resumen td { padding: 6px 4px; }

  .pie-fijo {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    background: linear-gradient(to top, var(--fondo) 70%, rgba(250,250,249,0));
    padding: 18px 14px calc(14px + env(safe-area-inset-bottom, 0px));
  }
  .pie-fijo > div { max-width: 560px; margin: 0 auto; }
  .cargando { text-align: center; color: var(--tenue); padding: 60px 0; }
  .girando { width: 28px; height: 28px; border: 3px solid var(--amarillo-claro); border-top-color: var(--amarillo-btn); border-radius: 50%; margin: 0 auto 10px; animation: girar .8s linear infinite; }
  @keyframes girar { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .girando { animation-duration: 3s; } .btn { transition: none; } }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
</head>
<body>
<header id="encabezado">Tu pedido</header>
<main id="app" aria-live="polite">
  <div class="cargando"><div class="girando" aria-hidden="true"></div>Cargando…</div>
</main>

<script>
"use strict";

/* ---------- Configuración ---------- */
const HORA_INICIO = 7;          // primera hora de entrega (7:00)
const HORA_FIN = 19.5;          // última (19:30)
const DIAS_A_MOSTRAR = 14;      // cuántos días se pueden elegir
const DIAS_SIN_ENTREGA = [0];   // 0 = domingo. Quita el 0 si sí reciben en domingo.

/* ---------- Estado ---------- */
const token = decodeURIComponent(location.pathname.split("/").filter(Boolean).pop() || "");
const URL_API = "/api/t/" + encodeURIComponent(token);
const app = document.getElementById("app");
let orden = null;
let corrigiendo = false;
let elegido = { dia: null, hora: null };

/* ---------- Utilidades ---------- */
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const num = (n) => Number(n).toLocaleString("es-MX");
const dos = (n) => String(n).padStart(2, "0");
const claveDia = (d) => `${d.getFullYear()}-${dos(d.getMonth() + 1)}-${dos(d.getDate())}`;
// "2026-10-30T09:00" → Date local (sin conversiones de zona)
const aFecha = (s) => {
  const [f, h] = s.split("T");
  const [a, m, d] = f.split("-").map(Number);
  const [hh, mm] = h.split(":").map(Number);
  return new Date(a, m - 1, d, hh, mm);
};
const fmtCita = (s, mayuscula = true) => {
  const t = new Intl.DateTimeFormat("es-MX", { weekday: "long", day: "numeric", month: "long", hour: "numeric", minute: "2-digit" }).format(aFecha(s));
  return mayuscula ? t.charAt(0).toUpperCase() + t.slice(1) : t; // "Miércoles, 28 de octubre, 9:00 a.m."
};
const fmtHora = (h) => {
  const hh = Math.floor(h), mm = h % 1 ? "30" : "00";
  return `${hh > 12 ? hh - 12 : hh}:${mm} ${hh < 12 ? "a. m." : "p. m."}`;
};

/* ---------- Cargar ---------- */
async function cargar() {
  app.innerHTML = `<div class="cargando"><div class="girando" aria-hidden="true"></div>Cargando…</div>`;
  try {
    const r = await fetch(URL_API, { headers: { Accept: "application/json" } });
    if (r.status === 404) return pantallaError("Este enlace ya no es válido", "Pide uno nuevo a quien te mandó el pedido.", false);
    if (r.status === 429) return pantallaError("Demasiados intentos", "Espera un minuto y vuelve a intentar.", true);
    if (!r.ok) throw new Error();
    orden = await r.json();
    corrigiendo = false;
    pintar();
  } catch {
    pantallaError("No pudimos conectarnos", "Revisa tu internet y vuelve a intentar.", true);
  }
}

function pantallaError(titulo, texto, reintentar) {
  app.innerHTML = `
    <div class="tarjeta estado" role="alert">
      <div class="icono icono-gris" aria-hidden="true">!</div>
      <h2>${esc(titulo)}</h2>
      <p>${esc(texto)}</p>
      ${reintentar ? `<p style="margin-top:16px"><button class="btn btn-secundario" id="reintentar">Reintentar</button></p>` : ""}
    </div>`;
  document.getElementById("reintentar")?.addEventListener("click", cargar);
}

/* ---------- Dibujar según el estado ---------- */
function pintar() {
  document.getElementById("encabezado").textContent = orden.empresa;
  document.title = `${orden.modelo} · Operación ${orden.operacion}`;
  const cabecera = `
    <section class="tarjeta" aria-label="Datos del pedido">
      <p class="etiqueta">OP ${esc(orden.op)} · Operación ${esc(orden.operacion)}</p>
      <h1 class="modelo">${esc(orden.modelo)}</h1>
      <span class="chip-proceso">${esc(orden.proceso)}</span>
      <div class="datos"><span>Para <b>${esc(orden.proveedor)}</b></span></div>
    </section>`;

  if (orden.estado === "abierta" && (!orden.recibidoEn || corrigiendo)) return formulario(cabecera);
  if (orden.estado === "abierta") return enviado(cabecera);
  if (orden.estado === "programada") return programada(cabecera);
  return cerrada(cabecera);
}

function resumen() {
  const t = totales(orden.tallas);
  const filas = orden.tallas
    .map((x) => {
      const f = x.pedidas - x.primeras - x.segundas;
      return `<tr><td class="talla">${esc(x.talla)}</td><td class="pedidas">${num(x.pedidas)}</td><td>${num(x.primeras)}</td><td>${num(x.segundas)}</td><td class="faltan ${f > 0 ? "hay" : ""}">${num(f)}</td></tr>`;
    })
    .join("");
  return `
    <section class="tarjeta">
      <p class="etiqueta">Tu conteo</p>
      <table class="resumen">
        <thead><tr><th scope="col">Talla</th><th scope="col">Pedidas</th><th scope="col">Primeras</th><th scope="col">Segundas</th><th scope="col">Faltan</th></tr></thead>
        <tbody>${filas}</tbody>
      </table>
      <div class="totales"><span>Total <b>${num(t.primeras + t.segundas)}</b> de ${num(t.pedidas)}</span>${t.faltan ? `<span>Faltan <b>${num(t.faltan)}</b></span>` : ""}</div>
      ${orden.comentario ? `<p style="margin:12px 0 0;color:var(--tenue)">“${esc(orden.comentario)}”</p>` : ""}
    </section>`;
}

function enviado(cabecera) {
  app.innerHTML = `
    ${cabecera}
    <section class="tarjeta estado">
      <div class="icono icono-ok" aria-hidden="true">✓</div>
      <h2>Recibimos tu conteo</h2>
      <p>Propusiste entregar el</p>
      <p class="fecha-grande">${esc(fmtCita(orden.citaPropuesta))}</p>
      <p style="margin-top:10px">Te confirmaremos la cita. Mientras tanto, puedes corregir si algo cambió.</p>
      <p style="margin-top:16px"><button class="btn btn-secundario" id="corregir">Corregir</button></p>
    </section>
    ${resumen()}`;
  document.getElementById("corregir").addEventListener("click", () => {
    corrigiendo = true;
    pintar();
  });
}

function programada(cabecera) {
  app.innerHTML = `
    ${cabecera}
    <section class="tarjeta estado">
      <div class="icono icono-cita" aria-hidden="true">📅</div>
      <h2>Entrega confirmada</h2>
      <p class="fecha-grande">${esc(fmtCita(orden.citaConfirmada))}</p>
      <p style="margin-top:10px">Si necesitas cambiarla, comunícate con nosotros.</p>
    </section>
    ${orden.recibidoEn ? resumen() : ""}`;
}

function cerrada(cabecera) {
  app.innerHTML = `
    ${cabecera}
    <section class="tarjeta estado">
      <div class="icono icono-gris" aria-hidden="true">✓</div>
      <h2>Pedido cerrado</h2>
      <p>Entrega del ${esc(fmtCita(orden.citaConfirmada, false))}</p>
    </section>
    ${orden.recibidoEn ? resumen() : ""}`;
}

/* ---------- Formulario de captura ---------- */
function totales(tallas) {
  return tallas.reduce(
    (a, x) => ({
      pedidas: a.pedidas + x.pedidas,
      primeras: a.primeras + (x.primeras || 0),
      segundas: a.segundas + (x.segundas || 0),
      faltan: a.faltan + Math.max(0, x.pedidas - (x.primeras || 0) - (x.segundas || 0)),
    }),
    { pedidas: 0, primeras: 0, segundas: 0, faltan: 0 }
  );
}

// Días que se pueden elegir (hoy solo si todavía quedan horas)
function diasDisponibles() {
  const hoy = new Date();
  hoy.setHours(0, 0, 0, 0);
  const lista = [];
  for (let i = 0; lista.length < DIAS_A_MOSTRAR && i < DIAS_A_MOSTRAR * 2; i++) {
    const d = new Date(hoy);
    d.setDate(hoy.getDate() + i);
    if (DIAS_SIN_ENTREGA.includes(d.getDay())) continue;
    if (i === 0 && horasDisponibles(claveDia(d)).length === 0) continue;
    lista.push(d);
  }
  return lista;
}
function horasDisponibles(dia) {
  const ahora = new Date();
  const horas = [];
  for (let h = HORA_INICIO; h <= HORA_FIN; h += 0.5) {
    const f = aFecha(`${dia}T${dos(Math.floor(h))}:${h % 1 ? "30" : "00"}`);
    if (f > ahora) horas.push(h);
  }
  return horas;
}

function formulario(cabecera) {
  // Si ya había conteo, se precarga; si no, va vacío para que lo capture
  const yaContado = orden.tallas.some((x) => x.primeras || x.segundas);
  const valor = (n) => (yaContado ? n : "");

  // Propuesta anterior: se marca si sigue siendo válida
  if (orden.citaPropuesta && !elegido.dia) {
    const [d, h] = orden.citaPropuesta.split("T");
    const [hh, mm] = h.split(":").map(Number);
    if (aFecha(orden.citaPropuesta) > new Date()) elegido = { dia: d, hora: hh + (mm >= 30 ? 0.5 : 0) };
  }

  const filas = orden.tallas
    .map(
      (x, i) => `
      <tr>
        <th scope="row" class="talla" style="text-align:left;font-size:17px;color:var(--texto);padding:6px 4px;text-transform:none;letter-spacing:0">${esc(x.talla)}</th>
        <td class="pedidas">${num(x.pedidas)}</td>
        <td><input type="number" inputmode="numeric" min="0" max="${x.pedidas}" data-i="${i}" data-campo="primeras" value="${valor(x.primeras)}" placeholder="0" aria-label="Primeras de talla ${esc(x.talla)}"></td>
        <td><input type="number" inputmode="numeric" min="0" max="${x.pedidas}" data-i="${i}" data-campo="segundas" value="${valor(x.segundas)}" placeholder="0" aria-label="Segundas de talla ${esc(x.talla)}"></td>
        <td class="faltan" id="faltan-${i}" aria-label="Faltan de talla ${esc(x.talla)}"></td>
      </tr>`
    )
    .join("");

  const dias = diasDisponibles();
  if (elegido.dia && !dias.some((d) => claveDia(d) === elegido.dia)) elegido = { dia: null, hora: null };
  const nombreDia = (d, i) => {
    const hoy = new Date(); hoy.setHours(0, 0, 0, 0);
    const dif = Math.round((d - hoy) / 86400000);
    const arriba = dif === 0 ? "Hoy" : dif === 1 ? "Mañana" : new Intl.DateTimeFormat("es-MX", { weekday: "short" }).format(d).replace(".", "");
    const abajo = new Intl.DateTimeFormat("es-MX", { day: "numeric", month: "short" }).format(d).replace(".", "");
    return `<span>${esc(arriba)}<small>${esc(abajo)}</small></span>`;
  };

  app.innerHTML = `
    ${cabecera}
    <form id="forma" novalidate>
      <section class="tarjeta">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px">
          <p class="etiqueta" style="margin:0">¿Cuántas piezas entregas?</p>
          <button type="button" class="btn btn-secundario btn-chico" id="todas-bien">Todas salieron bien</button>
        </div>
        <table>
          <thead><tr>
            <th scope="col">Talla</th>
            <th scope="col">Pedidas</th>
            <th scope="col"><span class="punto" style="background:var(--verde)"></span>Primeras</th>
            <th scope="col"><span class="punto" style="background:var(--amarillo-btn)"></span>Segundas</th>
            <th scope="col">Faltan</th>
          </tr></thead>
          <tbody>${filas}</tbody>
        </table>
        <div class="totales" id="totales"></div>
      </section>

      <section class="tarjeta">
        <label for="comentario" class="etiqueta" style="display:block">Comentarios <span style="text-transform:none;letter-spacing:0;font-weight:400">(opcional)</span></label>
        <textarea id="comentario" maxlength="1000" placeholder="Por ejemplo: 2 M con mancha">${esc(orden.comentario)}</textarea>
      </section>

      <section class="tarjeta">
        <p class="etiqueta">¿Cuándo entregas?</p>
        <fieldset>
          <legend class="sr">Día de entrega</legend>
          <div class="opciones" id="dias">
            ${dias
              .map((d, i) => {
                const k = claveDia(d);
                return `<label class="opcion dia"><input type="radio" name="dia" value="${k}" ${elegido.dia === k ? "checked" : ""}>${nombreDia(d, i)}</label>`;
              })
              .join("")}
          </div>
        </fieldset>
        <fieldset id="campo-hora">
          <legend>Hora</legend>
          <div class="rejilla" id="horas"></div>
        </fieldset>
      </section>

      <div class="aviso aviso-error" id="error" role="alert"></div>

      <div class="pie-fijo"><div>
        <button type="submit" class="btn btn-primario" id="enviar">${orden.recibidoEn ? "Guardar cambios" : "Enviar conteo"}</button>
        ${corrigiendo ? `<button type="button" class="btn btn-secundario" id="cancelar" style="width:100%;margin-top:8px">Cancelar</button>` : ""}
      </div></div>
    </form>`;

  const forma = document.getElementById("forma");
  const entradas = [...forma.querySelectorAll("input[type=number]")];

  // Al tocar un número se selecciona para escribir encima
  entradas.forEach((el) => {
    el.addEventListener("focus", () => el.select());
    el.addEventListener("input", recalcular);
  });
  document.getElementById("todas-bien").addEventListener("click", () => {
    orden.tallas.forEach((x, i) => {
      forma.querySelector(`[data-i="${i}"][data-campo=primeras]`).value = x.pedidas;
      forma.querySelector(`[data-i="${i}"][data-campo=segundas]`).value = 0;
    });
    recalcular();
  });
  forma.querySelectorAll("input[name=dia]").forEach((el) =>
    el.addEventListener("change", () => {
      elegido = { dia: el.value, hora: elegido.hora };
      pintarHoras();
    })
  );
  document.getElementById("cancelar")?.addEventListener("click", () => {
    corrigiendo = false;
    elegido = { dia: null, hora: null };
    pintar();
  });
  forma.addEventListener("submit", enviar);
  // En cuanto corrige algo, se quita el aviso de error
  forma.addEventListener("input", () => (document.getElementById("error").textContent = ""));
  forma.addEventListener("change", () => (document.getElementById("error").textContent = ""));

  pintarHoras();
  recalcular();
}

function pintarHoras() {
  const caja = document.getElementById("horas");
  const campo = document.getElementById("campo-hora");
  if (!elegido.dia) {
    campo.style.display = "none";
    return;
  }
  campo.style.display = "";
  const horas = horasDisponibles(elegido.dia);
  if (!horas.includes(elegido.hora)) elegido.hora = null;
  caja.innerHTML = horas
    .map((h) => `<label class="opcion"><input type="radio" name="hora" value="${h}" ${elegido.hora === h ? "checked" : ""}><span>${fmtHora(h)}</span></label>`)
    .join("");
  caja.querySelectorAll("input[name=hora]").forEach((el) => el.addEventListener("change", () => (elegido.hora = Number(el.value))));
}

// Lee lo capturado; vacío cuenta como 0
function leerConteo() {
  return orden.tallas.map((x, i) => {
    const v = (c) => {
      const s = document.querySelector(`[data-i="${i}"][data-campo=${c}]`).value.trim();
      return s === "" ? 0 : Number(s);
    };
    return { talla: x.talla, pedidas: x.pedidas, primeras: v("primeras"), segundas: v("segundas") };
  });
}

function recalcular() {
  const conteo = leerConteo();
  conteo.forEach((x, i) => {
    const malo = (n) => !Number.isInteger(n) || n < 0;
    const sobra = x.primeras + x.segundas > x.pedidas;
    const f = x.pedidas - x.primeras - x.segundas;
    const celda = document.getElementById(`faltan-${i}`);
    celda.textContent = sobra ? `+${num(-f)}` : num(f);
    celda.className = `faltan ${sobra ? "mal" : f > 0 ? "hay" : ""}`;
    ["primeras", "segundas"].forEach((c) =>
      document.querySelector(`[data-i="${i}"][data-campo=${c}]`).classList.toggle("mal", sobra || malo(x[c]))
    );
  });
  const t = totales(conteo);
  document.getElementById("totales").innerHTML =
    `<span>Entregas <b>${num(t.primeras + t.segundas)}</b> de ${num(t.pedidas)}</span>` +
    (t.segundas ? `<span>Segundas <b>${num(t.segundas)}</b></span>` : "") +
    (t.faltan ? `<span>Faltan <b>${num(t.faltan)}</b></span>` : "");
}

async function enviar(e) {
  e.preventDefault();
  const error = document.getElementById("error");
  const boton = document.getElementById("enviar");
  error.textContent = "";

  const conteo = leerConteo();
  const problema =
    conteo.find((x) => [x.primeras, x.segundas].some((n) => !Number.isInteger(n) || n < 0))
      ? "Revisa los números: solo se valen números enteros."
      : conteo.find((x) => x.primeras + x.segundas > x.pedidas)
      ? `Talla ${conteo.find((x) => x.primeras + x.segundas > x.pedidas).talla}: hay más piezas que las pedidas.`
      : conteo.every((x) => !x.primeras && !x.segundas)
      ? "Captura cuántas piezas entregas."
      : !elegido.dia
      ? "Elige el día de entrega."
      : elegido.hora == null
      ? "Elige la hora de entrega."
      : null;
  if (problema) {
    error.textContent = problema;
    error.scrollIntoView({ behavior: "smooth", block: "center" });
    return;
  }

  const hh = Math.floor(elegido.hora);
  const cuerpo = {
    tallas: conteo.map(({ talla, primeras, segundas }) => ({ talla, primeras, segundas })),
    comentario: document.getElementById("comentario").value.trim(),
    citaPropuesta: `${elegido.dia}T${dos(hh)}:${elegido.hora % 1 ? "30" : "00"}`,
  };

  boton.disabled = true;
  boton.textContent = "Enviando…";
  try {
    const r = await fetch(URL_API, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(cuerpo) });
    const datos = await r.json().catch(() => null);
    if (!r.ok) {
      if (r.status === 409 || r.status === 404) {
        // La cita ya se confirmó o el enlace se desactivó: mostrar cómo quedó
        await cargar();
        return;
      }
      throw new Error(datos?.error || (r.status === 429 ? "Demasiados intentos, espera un minuto." : "No se pudo enviar. Intenta otra vez."));
    }
    orden = datos;
    corrigiendo = false;
    elegido = { dia: null, hora: null };
    pintar();
    window.scrollTo({ top: 0, behavior: "smooth" });
  } catch (err) {
    error.textContent = err.message === "Failed to fetch" ? "No hay conexión. Revisa tu internet e intenta otra vez." : err.message;
    boton.disabled = false;
    boton.textContent = orden.recibidoEn ? "Guardar cambios" : "Enviar conteo";
  }
}

cargar();
</script>
